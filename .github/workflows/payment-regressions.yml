name: Payment regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  payment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit shared dependencies for high and critical advisories
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser regression dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify deletion and listing transactions with isolated PostgreSQL connections
        run: BLUEBIRD_DELETION_PG=1 node --experimental-strip-types --test tests/account-deletion-concurrency.test.mjs tests/account-deletion-profiles-concurrency.test.mjs tests/account-deletion-conversations-concurrency.test.mjs tests/account-deletion-inquiries-concurrency.test.mjs tests/account-deletion-applications-concurrency.test.mjs tests/account-deletion-listings-concurrency.test.mjs tests/account-deletion-settlement-notices.test.mjs tests/account-deletion-catalog-concurrency.test.mjs tests/catalog-admin-variations-concurrency.test.mjs tests/account-deletion-submissions-concurrency.test.mjs tests/account-deletion-sightings-concurrency.test.mjs tests/account-deletion-sourcing-concurrency.test.mjs tests/account-deletion-activity-concurrency.test.mjs tests/account-deletion-consents-concurrency.test.mjs tests/account-deletion-business-claims-concurrency.test.mjs tests/account-deletion-ledger-actors-concurrency.test.mjs tests/account-deletion-records-work-concurrency.test.mjs tests/apple-authorization-vault-concurrency.test.mjs tests/account-deletion-authorization-concurrency.test.mjs tests/mobile-listing-management-concurrency.test.mjs tests/mobile-listing-production-concurrency.test.mjs
      - run: npm run test:payments
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:seo:ssr
      - name: Install mobile app dependencies
        run: npm ci --prefix apps/mobile
      - name: Audit declared mobile dependencies for high and critical advisories
        run: npm --prefix apps/mobile audit --audit-level=high
      - name: Compile bundled mobile app
        run: npm run build:mobile
      - name: Install mobile browser test runtime
        run: npm --prefix apps/mobile exec -- playwright install chromium
      - name: Verify bundled startup and outdated-runtime recovery
        run: npm run test:mobile:runtime:ui
        env:
          BLUEBIRD_SKIP_RUNTIME_SCREENSHOTS: "true"
      - name: Verify native shopper privacy and recommendation screens
        run: npm run test:mobile:shopping:ui
      - name: Verify overlapping public startup reads and session restoration
        run: npm run test:mobile:startup:ui
        env:
          BLUEBIRD_SKIP_STARTUP_SCREENSHOTS: "true"
      - name: Verify shared website navigation and native authentication screens
        run: npm run test:mobile:auth:ui
      - name: Verify shared conversation screens and account-scoped message retries
        run: npm run test:mobile:messages:ui
      - name: Verify shared seller and listing forms with durable posting recovery
        run: npm run test:mobile:posting:ui
      - name: Verify shared listing management, stale edits and durable action recovery
        run: npm run test:mobile:listings:ui
      - name: Verify shared account controls and account-scoped security actions
        run: npm run test:mobile:account:ui
        env:
          BLUEBIRD_RUNTIME_COMPAT_MODE: "true"
      - name: Verify shared browse filters and durable saved-search recovery
        run: npm run test:mobile:browse:ui
      - name: Verify shared notification screens and app-scoped unread state
        run: npm run test:mobile:notifications:ui
      - name: Verify shared listing details and account-scoped contact actions
        run: npm run test:mobile:details:ui
      - name: Verify homepage refresh, startup artwork, cached jobs and navigation cleanup
        run: npm run test:mobile:home:ui
        env:
          BLUEBIRD_SKIP_HOME_SCREENSHOTS: "true"
      - name: Verify shared seller and dealership storefronts with private account isolation
        run: npm run test:mobile:storefronts:ui
      - name: Verify prepared native navigation, page refresh, filters and automatic loading
        run: npm run test:mobile:polish:ui
