name: Payment regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  payment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser regression dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: npm run test:payments
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:seo:ssr
      - name: Install mobile app dependencies
        run: npm ci --prefix apps/mobile
      - name: Audit declared mobile dependencies for high and critical advisories
        run: npm --prefix apps/mobile audit --audit-level=high
      - name: Compile bundled mobile app
        run: npm run build:mobile
      - name: Install mobile browser test runtime
        run: npm --prefix apps/mobile exec -- playwright install chromium
      - name: Verify native shopper privacy and recommendation screens
        run: npm run test:mobile:shopping:ui
      - name: Verify shared website navigation and native authentication screens
        run: npm run test:mobile:auth:ui
      - name: Verify shared conversation screens and account-scoped message retries
        run: npm run test:mobile:messages:ui
      - name: Verify shared seller and listing forms with durable posting recovery
        run: npm run test:mobile:posting:ui
      - name: Verify shared account controls and account-scoped security actions
        run: npm run test:mobile:account:ui
      - name: Verify shared browse filters and durable saved-search recovery
        run: npm run test:mobile:browse:ui
      - name: Verify shared notification screens and app-scoped unread state
        run: npm run test:mobile:notifications:ui
      - name: Verify shared listing details and account-scoped contact actions
        run: npm run test:mobile:details:ui
      - name: Verify shared seller and dealership storefronts with private account isolation
        run: npm run test:mobile:storefronts:ui
