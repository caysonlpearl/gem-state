name: Payment regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  payment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser regression dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: npm run test:payments
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:seo:ssr
