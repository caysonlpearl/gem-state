# All vendor accounts are created by bluebird-sftp-account with this prefix.
# Keep authentication overrides (60-bluebird-sftp-*.conf) before this file.
Match User bbfeed_*
    ChrootDirectory /srv/bluebird-sftp/%u
    AuthorizedKeysFile /etc/ssh/bluebird-sftp-keys/%u
    ForceCommand internal-sftp -d /incoming -u 0077
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    X11Forwarding no
    MaxSessions 1
    LogLevel VERBOSE
Match all
